name: Release

# The release lives in FireBall1725/workflows. This repo gains an rc channel it
# did not have: an rc builds a pullable image without moving :latest, so a
# change can be deployed and tested before it counts as released.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: rc
        type: choice
        options:
          - rc
          - stable
      dry-run:
        description: Compute and build, but push nothing and tag nothing
        required: false
        default: false
        type: boolean
      force-version:
        description: Re-cut this exact version instead of computing the next one
        required: false
        default: ""
        type: string

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: FireBall1725/workflows/.github/workflows/release-container.yml@v1
    with:
      image: ghcr.io/fireball1725/librarium-api
      channel: ${{ inputs.channel }}
      dry-run: ${{ inputs.dry-run }}
      force-version: ${{ inputs.force-version }}
      # rc and stable pin themselves into homelab-applications via an
      # auto-merging PR. Nightly never deploys, whatever this says.
      deploy-app: librarium-api
    secrets: inherit
