          "Ursula K. Le Guin" appears under L rather than U. '#' for anything
          that does not start with a letter.
        type: string
      libraries:
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_repository.AuthorLibraryRef'
        type: array
      name:
        type: string
      read_count:
        type: integer
      sort_name:
        type: string
      spines:
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_repository.AuthorSpine'
        type: array
    type: object
  github_com_fireball1725_librarium-api_internal_repository.AuthorLibraryRef:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  github_com_fireball1725_librarium-api_internal_repository.AuthorSpine:
    properties:
      book_id:
        type: string
      has_cover:
        type: boolean
      title:
        type: string
      updated_at:
        type: string
    type: object
  github_com_fireball1725_librarium-api_internal_repository.BookFacets:
    properties:
      favourite:
        description: |-
          Favourite is the per-book starred flag, counted as a dimension so
          "Favourites" can be a saved view with a number beside it. A rule, not a
          hand-picked set, which is what separates it from a shelf.
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_repository.FacetValue'
        type: array
      genre:
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_repository.FacetValue'
        type: array
      library:
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_repository.FacetValue'
        type: array
      location:
        description: |-
          Location is where the physical copy sits, counted up the tree: a book
          filed on a shelf counts under the bookcase holding it and the room
          holding that, so narrowing to a room does not hide what is inside it.
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_repository.FacetValue'
        type: array
      media_type:
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_repository.FacetValue'
        type: array
      my_rating:
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_repository.FacetValue'
        type: array
      ownership:
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_repository.FacetValue'
        type: array
      rating:
        description: |-
          Rating is what everyone who can see the book thinks of it, averaged and
          rounded to a stored point. MyRating is the caller's own.
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_repository.FacetValue'
        type: array
      read_status:
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_repository.FacetValue'
        type: array
      shelf:
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_repository.FacetValue'
        type: array
      tag:
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_repository.FacetValue'
        type: array
    type: object
  github_com_fireball1725_librarium-api_internal_repository.BookFingerprint:
    properties:
      max_updated_at:
        description: RFC3339; nil when library is empty
        type: string
      total:
        type: integer
    type: object
  github_com_fireball1725_librarium-api_internal_repository.BookReader:
    properties:
      display_name:
        type: string
      finished_at:
        type: string
      is_favorite:
        type: boolean
      rating:
        type: integer
      read_status:
        type: string
      review:
        type: string
      started_at:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  github_com_fireball1725_librarium-api_internal_repository.FacetValue:
    properties:
      count:
        type: integer
      label:
        type: string
      value:
        type: string
    type: object
  github_com_fireball1725_librarium-api_internal_repository.LibraryAccess:
    properties:
      book_count:
        type: integer
      library_id:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
      role:
        type: string
      slug:
        type: string
    type: object
  github_com_fireball1725_librarium-api_internal_repository.RoleCount:
    properties:
      code:
        type: string
      count:
        type: integer
    type: object
  github_com_fireball1725_librarium-api_internal_service.AIPermissions:
    properties:
      favourites:
        type: boolean
      full_library:
        type: boolean
      ratings:
        type: boolean
      reading_history:
        type: boolean
      taste_profile:
        type: boolean
    type: object
  github_com_fireball1725_librarium-api_internal_service.AIProviderStatus:
    properties:
      active:
        type: boolean
      config:
        additionalProperties:
          type: string
        type: object
      config_fields:
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_service.ConfigFieldView'
        type: array
      description:
        type: string
      display_name:
        type: string
      enabled:
        type: boolean
      has_api_key:
        type: boolean
      help_text:
        type: string
      help_url:
        type: string
      name:
        type: string
    type: object
  github_com_fireball1725_librarium-api_internal_service.AISuggestionsJobConfig:
    properties:
      enabled:
        type: boolean
      include_taste_profile:
        type: boolean
      interval_minutes:
        type: integer
      max_buy_per_user:
        type: integer
      max_read_next_per_user:
        type: integer
      max_tokens_backfill:
        description: |-
          MaxTokensBackfill applies to each backfill retry prompt. Smaller than
          initial since backfill only asks for the remaining slots.
        type: integer
      max_tokens_initial:
        description: |-
          MaxTokensInitial is the cap on output tokens for the first pass.
          Thinking models (qwen3, deepseek-r1, extended-thinking Claude) burn
          through many tokens reasoning before emitting anything — too low a
          cap leaves the response empty.
        type: integer
      user_run_rate_limit_per_day:
        type: integer
    type: object
  github_com_fireball1725_librarium-api_internal_service.ConfigFieldView:
    properties:
      help_text:
        type: string
      key:
        type: string
      label:
        type: string
      options:
        description: |-
          Options lets a provider suggest model IDs in a dropdown while still
          allowing free-text entry. Empty means pure free-text.
        items:
          type: string
        type: array
      placeholder:
        type: string
      required:
        type: boolean
      type:
        description: '"password" | "text" | "url" | "model"'
        type: string
    type: object
  github_com_fireball1725_librarium-api_internal_service.JobID:
    enum:
    - ai-suggestions
    type: string
    x-enum-varnames:
    - JobAISuggestions
  github_com_fireball1725_librarium-api_internal_service.JobSummary:
    properties:
      description:
        type: string
      display_name:
        type: string
      enabled:
        type: boolean
      id:
        $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_service.JobID'
      kind:
        description: '"scheduled" for now'
        type: string
    type: object
  github_com_fireball1725_librarium-api_internal_service.ProviderStatus:
    properties:
      capabilities:
        items:
          type: string
        type: array
      config:
        additionalProperties:
          type: string
        type: object
      config_fields:
        items:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_providers.ConfigField'
        type: array
      description:
        type: string
      display_name:
        type: string
      enabled:
        type: boolean
      has_api_key:
        type: boolean
      help_text:
        type: string
      help_url:
        type: string
      name:
        type: string
      requires_key:
        type: boolean
    type: object
  github_com_fireball1725_librarium-api_internal_service.UserAIPrefsView:
    properties:
      opt_in:
        type: boolean
    type: object
  internal_api_handlers.EventView:
    properties:
      content:
        items:
          type: integer
        type: array
      created_at:
        type: string
      seq:
        type: integer
      type:
        type: string
    type: object
  internal_api_handlers.JobView:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      error:
        type: string
      finished_at:
        type: string
      id:
        type: string
      kind:
        type: string
      kind_id:
        description: |-
          KindID is the per-kind detail row's primary key when one exists
          (import_jobs.id, enrichment_batches.id). Clients use it to deep-link
          the umbrella row back to its detail endpoint, which is keyed by the
          per-kind id rather than the umbrella job id. Empty for kinds that
          have no detail table (cover_backfill, ai_suggestions today).
        type: string
      library_id:
        type: string
      library_name:
        type: string
      progress:
        items:
          type: integer
        type: array
      schedule_id:
        type: string
      started_at:
        type: string
      status:
        type: string
      subtype:
        description: |-
          Subtype is the per-kind discriminator surfaced for UI badges.
          Today only enrichment uses it ("metadata" or "cover"); other
          kinds leave it empty and the client falls back to Kind alone.
        type: string
      triggered_by:
        type: string
      updated_at:
        type: string
    type: object
  internal_api_handlers.MeSeriesResult:
    properties:
      id:
        type: string
      library_id:
        type: string
      library_name:
        type: string
      name:
        type: string
    type: object
  internal_api_handlers.MeTagResult:
    properties:
      ambiguous:
        description: |-
          Ambiguous is true when another accessible library has a tag with the
          same (case-insensitive) name. The client appends " · <library>" in
          that case.
        type: boolean
      id:
        type: string
      library_id:
        type: string
      library_name:
        type: string
      name:
        type: string
    type: object
  internal_api_handlers.NamedRef:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  internal_api_handlers.NamedTagRef:
    properties:
      id:
        type: string
      library_id:
        type: string
      name:
        type: string
    type: object
  internal_api_handlers.QuotaView:
    properties:
      available:
        type: boolean
      limit:
        type: integer
      resets_at:
        type: string
      unavailable_reason:
        type: string
      unlimited:
        type: boolean
      used:
        type: integer
