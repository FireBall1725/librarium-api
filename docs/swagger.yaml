                  $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_api_responses.LoanResponse'
                type: array
              total:
                type: integer
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
