  /books/{book_id}/containers:
    get:
      description: The reverse direction, which answers "I own the 3-in-1, so do I
        have volume 2".
      parameters:
      - description: Book UUID
        in: path
        name: book_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              items:
                items:
                  properties:
                    container_id:
                      type: string
                    title:
                      type: string
                  type: object
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: List the works that contain this one
      tags:
      - catalogue
  /books/{book_id}/contents:
    get:
      description: An omnibus holding volumes 1 to 3, an anthology, an Ace Double.
        Ownership resolves through this, so holding the container counts as holding
        what is inside it.
      parameters:
      - description: Book UUID
        in: path
        name: book_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              items:
                items:
                  properties:
                    contained_id:
                      type: string
                    position:
                      type: number
                    title:
                      type: string
                  type: object
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: List what a work contains
      tags:
      - catalogue
    post:
      consumes:
      - application/json
      description: Containment means contains exactly, never overlaps. A re-cut edition
        whose volume boundaries do not line up is modelled as its own series instead.
      parameters:
      - description: Container book UUID
        in: path
        name: book_id
        required: true
        type: string
      - description: What it contains
        in: body
        name: body
        required: true
        schema:
          properties:
            contained_id:
              type: string
            position:
              type: number
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Record that a work contains another
      tags:
      - catalogue
  /books/{book_id}/contents/{contained_id}:
    delete:
      parameters:
      - description: Container book UUID
        in: path
        name: book_id
        required: true
        type: string
      - description: Contained book UUID
        in: path
        name: contained_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove a containment link
      tags:
      - catalogue
  /books/{book_id}/copies:
    get:
      description: Every copy of the work across the libraries the caller can reach,
        signed copies first. A copy with no edition means the printing was never recorded,
        which is a supported state.
      parameters:
      - description: Book UUID
        in: path
        name: book_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              items:
                items:
                  properties:
                    condition:
                      type: string
                    edition_id:
                      type: string
                    id:
                      type: string
                    is_signed:
                      type: boolean
                    library_id:
                      type: string
                    location_name:
                      type: string
                    on_loan_to:
                      type: string
                  type: object
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
