  internal_api_handlers.RunView:
    properties:
      error:
        type: string
      estimated_cost_usd:
        type: number
      finished_at:
        type: string
      id:
        type: string
      model_id:
        type: string
      provider_type:
        type: string
      started_at:
        type: string
      status:
        type: string
      steering:
        $ref: '#/definitions/internal_api_handlers.SteeringView'
      suggestion_count:
        type: integer
      tokens_in:
        type: integer
      tokens_out:
        type: integer
      triggered_by:
        type: string
      user_id:
        type: string
    type: object
  internal_api_handlers.ScheduleView:
    properties:
      config:
        items:
          type: integer
        type: array
      cron:
        type: string
      description:
        type: string
      display_name:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      kind:
        type: string
      last_fired_at:
        type: string
      next_fire_at:
        type: string
    type: object
  internal_api_handlers.SteeringView:
    properties:
      authors:
        items:
          $ref: '#/definitions/internal_api_handlers.NamedRef'
        type: array
      genres:
        items:
          $ref: '#/definitions/internal_api_handlers.NamedRef'
        type: array
      notes:
        type: string
      series:
        items:
          $ref: '#/definitions/internal_api_handlers.NamedRef'
        type: array
      tags:
        items:
          $ref: '#/definitions/internal_api_handlers.NamedTagRef'
        type: array
