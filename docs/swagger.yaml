                      type: string
                    value:
                      type: string
                  type: object
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: List a printing's identifiers
      tags:
      - catalogue
    post:
      consumes:
      - application/json
      description: An edition can carry several, including more than one of a scheme.
        What cannot happen is two editions claiming the same one, which is the uniqueness
        the dedup logic always assumed and never had.
      parameters:
      - description: Edition UUID
        in: path
        name: edition_id
        required: true
        type: string
      - description: The identifier
        in: body
        name: body
        required: true
