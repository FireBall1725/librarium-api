name: API Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/swagger.json"
      - "docs/swagger.yaml"
      - "docs/scalar.html"
      - ".github/workflows/docs.yml"
  # Inert in practice, and kept only because it costs nothing and would start
  # working the day a release is published by something other than the default
  # token. GitHub refuses to start a workflow from an event created with
  # GITHUB_TOKEN, and the shared release workflow publishes through
  # softprops/action-gh-release with no token of its own, so it falls back to
  # exactly that. Every API Docs run in this repo's history has come from a
  # push; not one has come from a release.
  release:
    types: [published]
  # So this is what actually catches a release. workflow_run fires on the run
  # completing rather than on the Release object being created, which sidesteps
  # the GITHUB_TOKEN rule without anyone having to mint a PAT.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A Release that failed, or was a dry run that tagged nothing, must not
    # republish the docs. Every other trigger is unconditional.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need full history + tags so we can derive the released version
          # for stamping into the spec below.
          fetch-depth: 0

      - name: Assemble Scalar static site
        # Mirrors the runtime Scalar UI in internal/api/handlers/docs.go
        # so the published docs and the in-app reference share one identity.
        run: |
          set -euo pipefail
          mkdir -p site
          cp docs/swagger.json site/openapi.json
          cp docs/swagger.yaml site/openapi.yaml
          cp docs/scalar.html site/index.html

          # The committed swagger spec carries whatever @version annotation
          # was in cmd/api/main.go at generation time and rarely matches the
          # latest tag (per workspace convention, the version string is owned
          # by release CI, not edited in source). Patch info.version on the
          # served copies so the published docs always track the latest tag.
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Newest STABLE tag, version-sorted.
            #
            # Deliberately not `git describe --tags --abbrev=0`. A stable
            # release is normally cut from the exact commit an rc already
            # tagged, so both tags land on one commit and describe returns
            # whichever it reaches first, which in practice is the rc. On
            # 2026-09-17 main sat on f556f8b carrying both v26.8.1-rc.11 and
            # v26.9.0, and describe answered rc.11.
            #
            # An rc exists so a build can be deployed without moving :latest.
            # Published docs should describe what people actually run, so the
            # pre-releases are filtered out rather than sorted around.
            VERSION="$(git tag --list 'v*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n1 | sed 's/^v//' || true)"
          fi
          if [ -n "${VERSION}" ]; then
            echo "Stamping spec version: ${VERSION}"
            jq --arg v "${VERSION}" '.info.version = $v' site/openapi.json > site/openapi.json.tmp
            mv site/openapi.json.tmp site/openapi.json
            yq -i ".info.version = \"${VERSION}\"" site/openapi.yaml
          else
            echo "No tag found; leaving spec version untouched."
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
