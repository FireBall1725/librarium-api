      name:
        type: string
      revoked_at:
        type: string
      scopes:
        items:
          type: string
        type: array
      token_suffix:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Librarium
    url: https://librarium.press
  description: Backend API for Librarium, a privacy-focused tracker for your physical
    book, manga, and comic collection. Powers the self-hosted edition today; iOS Lite
    and Librarium Plus (hosted) are on the roadmap. All protected endpoints require
    a Bearer JWT (or `lbrm_pat_*` personal access token) in the Authorization header.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
  termsOfService: https://librarium.press
  title: Librarium API
  version: 26.4.0
paths:
  /admin/books/{book_id}:
    delete:
      description: |-
        Permanently deletes the books row and cascades through all
        libraries, editions, user interactions, loans, and any other
        references. Use with care.
      parameters:
      - description: Book UUID
        in: path
        name: book_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a book entirely (admin only)
      tags:
      - admin
  /admin/connections/ai:
    get:
      description: Returns provider status, masked config, active flag, and config-field
        schema for each registered AI provider.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_service.AIProviderStatus'
            type: array
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: List AI providers (admin)
      tags:
      - admin
      - ai
  /admin/connections/ai/{provider}:
    put:
      consumes:
      - application/json
      description: Updates the API key, model, base URL, or enabled flag for the named
        provider. Secrets are merged over existing config so omitted keys are preserved.
      parameters:
      - description: Provider name
        in: path
        name: provider
        required: true
        type: string
      - description: Provider configuration key-value pairs
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_service.AIProviderStatus'
            type: array
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Configure an AI provider (admin)
      tags:
      - admin
      - ai
  /admin/connections/ai/{provider}/test:
    post:
      description: Performs a cheap probe call to verify the provider's API key and
        model.
      parameters:
      - description: Provider name
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              error:
                type: string
              ok:
                type: boolean
              reply:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Test an AI provider (admin)
      tags:
      - admin
      - ai
  /admin/connections/ai/active:
    post:
      consumes:
      - application/json
      description: Exactly one AI provider is active at a time. Passing an empty name
        disables AI suggestions.
      parameters:
      - description: Provider name
        in: body
        name: body
        required: true
        schema:
          properties:
            provider:
              type: string
          type: object
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set the active AI provider (admin)
      tags:
      - admin
      - ai
  /admin/connections/ai/ollama/models:
    get:
      description: Proxies the configured Ollama host's /api/tags endpoint. Used by
        the provider-config UI to render a model dropdown instead of a free-text input.
        Returns 503 when the host is unreachable so the UI can fall back to the text
        input.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              models:
                items:
                  type: object
                type: array
            type: object
        "503":
          description: Service Unavailable
          schema:
            properties:
              error:
                type: string
              reachable:
                type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: List locally-pulled Ollama models (admin)
      tags:
      - admin
      - ai
  /admin/connections/ai/osaurus/models:
    get:
      description: Proxies the configured Osaurus host's /v1/models endpoint (OpenAI
        shape). Used by the provider-config UI to render a model dropdown instead
        of a free-text input. Returns 503 when the host is unreachable so the UI can
        fall back to the text input.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              models:
                items:
                  type: object
                type: array
            type: object
        "503":
          description: Service Unavailable
          schema:
            properties:
              error:
                type: string
              reachable:
                type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: List models available on the configured Osaurus host (admin)
      tags:
      - admin
      - ai
  /admin/connections/ai/permissions:
    get:
      description: Returns the deployment-wide data categories the AI may access.
        Combined restrictive-wins with each user's opt-in.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_service.AIPermissions'
      security:
      - BearerAuth: []
      summary: Get AI data-access permissions (admin)
      tags:
      - admin
      - ai
    put:
      consumes:
      - application/json
      description: Replaces the deployment-wide data-access policy. All fields must
        be provided; omitted fields default to false.
      parameters:
      - description: Permissions object
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_service.AIPermissions'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_service.AIPermissions'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update AI data-access permissions (admin)
      tags:
      - admin
      - ai
  /admin/jobs:
    get:
      description: Returns a summary of every admin-configurable scheduled job.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_service.JobSummary'
            type: array
      security:
      - BearerAuth: []
      summary: List configurable jobs (admin)
      tags:
      - admin
      - jobs
  /admin/jobs/{id}:
    delete:
      parameters:
      - description: job id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a job entirely
      tags:
      - admin
      - jobs
    get:
      parameters:
      - description: job id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              events:
                type: array
              job:
                $ref: '#/definitions/internal_api_handlers.JobView'
            type: object
      security:
      - BearerAuth: []
      summary: Get unified job detail with event log
      tags:
      - admin
      - jobs
  /admin/jobs/ai-metadata/runs/{job_id}:
    get:
      description: |-
        Same shape as the AI suggestions run-detail endpoint so the
        shared `RunDetailPanel` component can render either kind.
        Synthesises a 2-event timeline (prompt + ai_response) from the
        prompt + response_text columns on `ai_metadata_runs`.
      parameters:
      - description: Job UUID
        in: path
        name: job_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              events:
                type: array
              run:
                type: object
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
