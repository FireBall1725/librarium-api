  /books/{book_id}/sessions:
    get:
      description: Each pass through the work, most recent first. A reread is a separate
        session rather than a counter, so it can say when and in which printing.
      parameters:
      - description: Book UUID
        in: path
        name: book_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              items:
                items:
                  properties:
                    book_id:
                      type: string
                    edition_id:
                      type: string
                    finished_at:
                      type: string
                    id:
                      type: string
                    progress_unit:
                      type: string
                    progress_value:
                      type: number
                    started_at:
                      type: string
                    status:
                      type: string
                  type: object
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: List my reading sessions for a book
      tags:
      - me
    post:
      consumes:
      - application/json
      description: Records one pass through a work. Progress is a unit and a value
        rather than a blob; page progress requires an edition, because page 200 of
        a paperback is not page 200 of the omnibus.
      parameters:
      - description: Book UUID
        in: path
        name: book_id
        required: true
        type: string
      - description: The session
        in: body
        name: body
        required: true
        schema:
          properties:
            edition_id:
              type: string
            finished_at:
              type: string
            progress_unit:
              type: string
            progress_value:
              type: number
            started_at:
              type: string
            status:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              book_id:
                type: string
              id:
                type: string
              status:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Log a reading session
      tags:
      - me
  /components:
    get:
      description: Every Go module linked into this API binary, with its version and
