        name: media_type_id
        required: true
        type: string
      - description: Updated fields
        in: body
        name: body
        required: true
        schema:
          properties:
            description:
              type: string
            display_name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_api_responses.MediaTypeResponse'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a media type (admin)
      tags:
      - media-types
  /sessions/{session_id}:
    delete:
      parameters:
      - description: Session UUID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a reading session
      tags:
      - me
    patch:
      consumes:
      - application/json
      description: Partial update. A field left out is untouched; send it as null
        to clear it, which is how a mistyped finish date is removed rather than overwritten.
      parameters:
      - description: Session UUID
        in: path
        name: session_id
        required: true
        type: string
      - description: The changes
        in: body
        name: body
        required: true
        schema:
          properties:
            edition_id:
              type: string
            finished_at:
              type: string
            progress_unit:
              type: string
            progress_value:
              type: number
            started_at:
              type: string
            status:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              book_id:
                type: string
              finished_at:
                type: string
              id:
                type: string
              started_at:
                type: string
              status:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Correct a logged reading session
      tags:
      - me
  /setup/admin:
    post:
      consumes:
      - application/json
      description: Creates the initial instance admin on a fresh install. Fails with
        409 once any user exists.
      parameters:
      - description: Admin account request
        in: body
        name: body
        required: true
        schema:
          properties:
            display_name:
              type: string
            email:
              type: string
            password:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              access_token:
                type: string
              expires_in:
                type: integer
              refresh_token:
                type: string
              user:
                type: object
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Create first instance admin
      tags:
      - setup
  /setup/status:
    get:
      description: Returns whether the instance has been initialized (at least one
        user exists).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              initialized:
                type: boolean
            type: object
      summary: Setup status
      tags:
      - setup
  /sync/apply:
    post:
      consumes:
      - application/json
      description: 'Applies client ops with per-field last-writer-wins. Every op comes
        back with its own status, so a partial success is normal and the client clears
        only the ops it sees applied. Update-only in v1: create new rows through the
        per-resource endpoints.'
      parameters:
      - description: Ops to apply, at most 1000
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_api_responses.SyncApplyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_api_responses.SyncApplyResponse'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Push a batch of client changes
      tags:
      - sync
  /sync/changes:
    get:
      description: Returns the caller's data changed since `since`, oldest first.
        Advance `since` to the newest updated_at you applied. When has_more is true
        the response hit `limit` and you should call again straight away.
      parameters:
      - description: RFC3339 timestamp; returns changes strictly newer than this
        in: query
        name: since
        required: true
        type: string
      - description: Ops per response, 1 to 1000 (default 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_api_responses.SyncChangesResponse'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Pull changes since a timestamp
      tags:
      - sync
  /users:
    get:
      description: Full-text search across users; returns minimal profile data. Query
        must be at least 2 characters.
      parameters:
      - description: Search query (min 2 chars)
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              properties:
                display_name:
                  type: string
                email:
                  type: string
                id:
                  type: string
                username:
                  type: string
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Search users
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: 'Enter: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
