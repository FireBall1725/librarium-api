        fills itself. Visibility is private, library or public; a public list is given
        an unguessable share token, since on a public link the token is the only credential.
      parameters:
      - description: The list
        in: body
        name: body
        required: true
        schema:
          properties:
            color:
              type: string
            description:
              type: string
            filter:
              type: object
            icon:
              type: string
            kind:
              type: string
            layout:
              type: string
            name:
              type: string
            shared_library_id:
              type: string
            surface:
              type: string
            visibility:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              id:
                type: string
              kind:
                type: string
              name:
                type: string
              share_token:
                type: string
              visibility:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a list
      tags:
      - me
  /me/lists/{list_id}:
    delete:
      parameters:
      - description: List UUID
        in: path
        name: list_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete one of my lists
      tags:
      - me
    patch:
      consumes:
      - application/json
      description: |-
        Also moves a list between private, shared with a library and public. Sharing into a library needs a role on it, and a public list keeps the token it already has so links already handed out keep working.
        Only the keys present are changed, so renaming a list does not require sending the rest of it back. Kind is absent on purpose: a manual list cannot become smart without its enumerated books becoming a lie.
      parameters:
      - description: List UUID
        in: path
        name: list_id
        required: true
        type: string
      - description: The changes
        in: body
        name: body
        required: true
        schema:
          properties:
            color:
              type: string
            description:
              type: string
            display_order:
              type: integer
            filter:
              type: object
            icon:
              type: string
            layout:
              type: string
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              book_count:
                type: integer
              id:
                type: string
              kind:
                type: string
              name:
                type: string
              visibility:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change one of my lists
      tags:
      - me
