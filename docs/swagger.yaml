  /books/{book_id}/me:
    delete:
      description: Soft-deletes the caller's opinion. The review and notes history
        tables keep the text, so this is recoverable.
      parameters:
      - description: Book UUID
        in: path
        name: book_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Forget my reading state for a book
      tags:
      - me
    get:
      description: |-
        The caller's status, rating, review and notes for a work. Reads through containment, so a volume inside an omnibus the caller has read comes back as read with inherited set.
        Everyone who shares a library with the caller and has recorded something: their rating, whether they finished it, and the review the product already labels visible to members. Private notes are never returned; the query does not select them.
      parameters:
      - description: Book UUID
        in: path
        name: book_id
        required: true
        type: string
      - description: Book UUID
        in: path
        name: book_id
        required: true
        type: string
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              items:
                items:
                  $ref: '#/definitions/github_com_fireball1725_librarium-api_internal_repository.BookReader'
                type: array
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      - BearerAuth: []
      summary: What everyone has recorded about a book
      tags:
      - me
      - books
    put:
      consumes:
      - application/json
      description: Partial update. Any field left out is untouched, which is what
        lets two clients edit different fields without either losing. Send clear_rating
        to remove a rating, since omitting it means "no change".
      parameters:
      - description: Book UUID
        in: path
        name: book_id
        required: true
        type: string
      - description: Reading state
        in: body
        name: body
        required: true
        schema:
          properties:
            clear_rating:
              type: boolean
            is_favorite:
              type: boolean
            notes:
              type: string
            rating:
              type: integer
            read_status:
              type: string
            review:
              type: string
            wants:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              book_id:
                type: string
              is_favorite:
                type: boolean
              notes:
                type: string
              rating:
                type: integer
              read_status:
                type: string
              review:
                type: string
              wants:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set my reading state for a book
      tags:
      - me
