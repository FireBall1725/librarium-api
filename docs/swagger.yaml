  /editions/{edition_id}/identifiers:
    get:
      description: ISBN is one scheme among several. A 1957 Ace Double has no ISBN
        and never will; its publisher catalogue number is the best identifier in existence
        for it.
      parameters:
      - description: Edition UUID
        in: path
        name: edition_id
        required: true
